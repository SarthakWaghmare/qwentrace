services:
  - type: web
    name: qwentrace-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: QWEN_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: QWEN_MODEL
        value: qwen/qwen3-coder